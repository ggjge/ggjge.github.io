# ===================================================================
# 站点基本信息（请替换成你自己的信息）
# ===================================================================
title: "lihehan"
name: "lihehan"
description: "个人学术主页 · 研究方向：NLP / LLM Post Training / Generative Retrieval"
url: https://你的用户名.github.io      # 改成 https://你的GitHub用户名.github.io
baseurl: ""
repository: "你的用户名/你的用户名.github.io"

# ===================================================================
# 侧边栏 / 顶部作者信息（对应她主页左上角那块：照片 + 链接）
# 不需要的链接留空或删掉整行即可
# ===================================================================
author:
  name: "lihehan"
  avatar: "profile.png"               # 头像文件放在 images/ 目录下
  bio: "Baidu"
  location: ""
  email: "lhhzkj@gmail.com"
  # ---- 学术 / 社交链接（有就填，没有就删掉对应行）----
  googlescholar: ""
  github: ""
  linkedin: ""
  orcid: ""
  dblp: ""
  # 微信（AcademicPages 原生无此图标，已在 about 页脚手动写出）
  # wechat: "li44971"

# ===================================================================
# 站点构建设置（一般无需改动）
# ===================================================================
markdown: kramdown
remote_theme: "academicpages/academicpages.github.io"
locale: "zh-CN"
title_separator: "-"
words_per_minute: 160

# 集合（Publications 用）
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# 默认 front matter
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# 排除文件
exclude:
  - README_使用说明.md
  - vendor
